name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js (for choke panel JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sim,mcp,app]"

      - name: Run physics, simulator API, and MCP server test suite
        run: |
          pytest --ignore=tests/test_streamlit_app.py -q
